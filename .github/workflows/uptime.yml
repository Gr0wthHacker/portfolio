name: uptime
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check domains
        id: check
        run: |
          down="$(bash monitoring/check.sh monitoring/domains.txt)"
          echo "$down"
          {
            echo "down<<EOF"
            printf '%s\n' "$down"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      # One open issue holds the current list. It gets a comment only when the list changes,
      # and closes when everything is back, so a long outage is one notification, not 48 a day.
      - name: Open, update or close the uptime issue
        env:
          GH_TOKEN: ${{ github.token }}
          DOWN: ${{ steps.check.outputs.down }}
        run: |
          n=$(gh issue list --label uptime --state open --json number --jq '.[0].number')
          now="$(date -u '+%Y-%m-%d %H:%M') UTC"
          list="$(printf '%s\n' "$DOWN" | sed '/^$/d' | sort | sed 's/^/- /')"
          if [ -z "$list" ]; then
            if [ -n "$n" ]; then gh issue close "$n" --comment "All monitored domains are up as of $now."; fi
            exit 0
          fi
          body="$(printf 'Currently failing (last changed %s):\n\n%s\n\n<!-- state\n%s\n-->' "$now" "$list" "$list")"
          if [ -z "$n" ]; then
            gh label create uptime --color B60205 2>/dev/null || true
            gh issue create --title "Sites down" --label uptime --body "$body"
            exit 0
          fi
          prev="$(gh issue view "$n" --json body --jq '.body' | sed -n '/^<!-- state$/,/^-->$/p' | sed '1d;$d')"
          if [ "$prev" != "$list" ]; then
            gh issue edit "$n" --body "$body"
            gh issue comment "$n" --body "$(printf 'The failing list changed at %s:\n\n%s' "$now" "$list")"
          fi
